name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/WhatsVoiceBubble-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatsVoiceBubble-debug-apk
          path: release/WhatsVoiceBubble-debug.apk

      - name: Publish GitHub Release when tag is pushed
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/WhatsVoiceBubble-debug.apk
          body: |
            WhatsVoiceBubble APK

            زر فحص التحديث داخل التطبيق يعتمد على آخر GitHub Release في spyzorro/whatsapp.
